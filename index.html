<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your studies and achieve your goals.</p>
    </header>

    <main>
        <section class="task-form">
            <h2>Add a New Task</h2>

            <form id="task-form">
                <input
                    type="text"
                    id="task-title"
                    placeholder="Enter task name"
                    required
                >

                <input
                    type="date"
                    id="task-deadline"
                    required
                >

                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="tasks">
            <h2>My Tasks</h2>
            <ul id="task-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
