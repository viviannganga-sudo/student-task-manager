
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyTrack | Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <aside class="sidebar">
        <h2>StudyTrack</h2>

        <nav>
            <a href="index.html" class="active">Dashboard</a>
            <a href="tasks.html">My Tasks</a>
        </nav>
    </aside>

    <main class="main-content">

        <header>
            <h1>My Dashboard</h1>
            <p>Welcome to StudyTrack. Organize your studies!</p>
        </header>

        <section class="summary-cards">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending Tasks</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed Tasks</h3>
                <p id="completedTasks">0</p>
            </div>

        </section>

        <section class="welcome-section">
            <h2>Manage Your Academic Work</h2>

            <p>
                Keep track of your assignments, organize your
                activities, and monitor your progress.
            </p>

            <a href="tasks.html" class="button">
                Go to My Tasks
            </a>
        </section>

    </main>

</body>
</html>
